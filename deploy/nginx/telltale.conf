# nginx in front of the Telltale Dashboard. Replace status.example.com and the
# certificate paths. The Dashboard listens on 127.0.0.1:8080 (see
# deploy/dashboard.toml); nginx terminates HTTPS.
#
# Give the name both an A and an AAAA record: Agents send Host Info once over
# IPv4 and once over IPv6, which is how the Dashboard learns both addresses.

upstream telltale_dashboard {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name status.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on; # Agents send Reports over HTTP/2 (nginx 1.25.1+; older: "listen 443 ssl http2;")
    server_name status.example.com;

    ssl_certificate     /etc/letsencrypt/live/status.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/status.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    server_tokens       off;
    # Once HTTPS works, tell browsers never to use plain HTTP for this name.
    # Agents need no such header: they refuse http:// to anything but loopback.
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # Reports and Host Info are at most 64 KiB.
    client_max_body_size 64k;

    proxy_http_version 1.1;

    # The Dashboard believes the forwarded headers only from its
    # trusted_proxies (loopback by default). $proxy_add_x_forwarded_for
    # appends the real client address, and the Dashboard takes the rightmost
    # untrusted hop, so a client cannot fake its address with the header.
    #
    # Each location repeats the headers: nginx drops inherited
    # proxy_set_header lines from any block that sets one of its own.
    location / {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_pass http://telltale_dashboard;
    }

    # Live updates for the Status page (WebSocket).
    location = /api/live {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 1h;
        proxy_pass http://telltale_dashboard;
    }
}
