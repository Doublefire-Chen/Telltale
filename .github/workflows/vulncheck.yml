name: Vulnerability check

on:
  push:
    branches: [main]
  pull_request:
  # Weekly too, so a newly published Go or dependency vulnerability shows up
  # even when nothing is pushed.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # Fails only for vulnerabilities in code the binaries can actually reach.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
