name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web app
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Go
        run: |
          go vet ./...
          go test -race ./...

  agent:
    name: Agent (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Agent and protocol tests (includes the collector smoke test)
        run: go test ./internal/agent/... ./internal/protocol/... ./cmd/telltale-agent/...
